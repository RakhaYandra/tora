name: ci
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make lint
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./internal/... ./tests/...
      - run: make e2e
